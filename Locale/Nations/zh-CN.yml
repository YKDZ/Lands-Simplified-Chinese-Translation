      trust:
        target: |
          <t:regular>Nation<t:entity_nation> <v:nation></t> invited your land<t:entity_land> <v:land></t> to join them.
            <hover:show_text:"<t:regular>Click here to accept this invite."><click:run_command:"/<v:cmd_accept>"><t:success>✔ Accept: <t:cmd>/<v:cmd_accept> </t><java><t:click>[CLICK]</t></java></click></hover>
            <hover:show_text:"<t:regular>Click here to deny this invite."><click:run_command:"/<v:cmd_deny>"><t:negative>✘ Deny: <t:cmd>/<v:cmd_deny> </t><java><t:click>[CLICK]</t></java></click></hover>
        already: <t:error>The land<t:error_value> <v:land></t> is already part of the nation<t:error_value> <v:nation></t>. <t:regular>They need to leave it first by using <t:cmd>/<v:cmd></t><t:regular>.
        success: <t:regular>You successfully invited land<t:entity_land> <v:land></t> to join your nation<t:entity_nation> <v:nation></t>.
        max-distance: <t:error>The land<t:error_value> <v:land></t> is too far away from the capital of nation<t:error_value> <v:nation></t>. <t:regular>Max:<t:limit> <v:max> block(s)</t>, actual distance:<t:regular_value> <v:distance> block(s)</t>
        camp: <t:error>Camps can't be part of nations. <t:regular>The land<t:entity_land> <v:land></t> is a camp.
        added: <t:regular>You successfully added your land<t:entity_land> <v:land></t> as a member of your nation<t:entity_nation> <v:nation></t>.
    rename:
      success: <t:regular>Successfully set the new name<t:regular_value> <v:name></t> for this nation <t:decoration>(</t><t:regular>Nation:<t:entity_nation> <v:nation></t><t:decoration>)</t><t:regular>. You paid<t:cost> <v:cost></t>.
    delete:
      success: <t:regular>Successfully deleted this nation <t:decoration>(</t><t:regular>Nation:<t:entity_nation> <v:nation></t><t:decoration>)</t><t:regular>.
      confirm: |
        <t:regular>Please confirm the deletion of nation<t:entity_nation> <v:nation></t> by clicking below:
          <hover:show_text:"<t:regular>Click here to confirm this action."><click:run_command:"/<v:fullcmd>"><t:success>✔ Confirm: <t:cmd>/<v:fullcmd> </t><java><t:click>[CLICK]</t></java></click></hover>
