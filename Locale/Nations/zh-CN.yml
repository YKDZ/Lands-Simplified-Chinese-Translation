      camp: |
        <t:error>你不能以露营地 <t:decoration>(</t><t:error_value><v:land></t>) <t:error>作为首都建立联邦.
          <hover:show_text:"<t:regular>创建城镇. 点击复制."><click:suggest_command:"/<v:cmd_create>"><t:regular>✖ 创建城镇: <t:cmd>/<v:cmd_create> </t><java><t:click>[点击]</t></java></click></hover>
      already: <t:error>你的城镇<t:error_value> <v:land></t> 已经属于联邦<t:error_value> <v:nation></t>. <t:regular>你的城镇需要先退出该联邦, 执行 <t:cmd>/<v:cmd></t><t:regular>.
