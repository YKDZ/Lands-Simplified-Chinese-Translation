      setcapital:
        level: "<t:error>You can't set the land<t:error_value> <v:land></t> as the new capital of nation<t:error_value> <v:nation></t>. <t:regular>It needs to be at least level<t:regular_value> <v:level></t> <t:decoration>(</t><t:regular>current: <t:regular_value><v:current></t><t:decoration>)</t><t:regular>."
