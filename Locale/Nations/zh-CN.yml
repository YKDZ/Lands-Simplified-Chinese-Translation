      success: <t:regular>已成功创建联邦<t:entity_nation> <v:nation></t>, 并将城镇<t:entity_land> <v:land></t> 设为首都. <hover:show_text:"<t:regular>打开菜单."><click:run_command:"/<v:cmd>"><t:regular>点击此处打开菜单.</click></hover>
    chat:
      format:
        discord: <noprefix><t:entity_nation>Nation <v:nation></t> <t:decoration>| </t><t:entity_nation>Discord </t><t:regular_value><v:player_display></t> <t:decoration>»</t><t:user_content> <v:message></t>
