      activated: <t:regular>Activated nation chat. Send a message in public chat to chat with your nation.
    member:
      untrust:
        already: <t:error>Land<t:error_value> <v:land></t> isn't a member of nation<t:error_value> <v:nation></t>.
        noaccess: "<t:error>You're not allowed to do this for nation<t:error_value> <v:nation></t>. <t:decoration>Flag: </t><t:regular_value><v:flag></t>"
