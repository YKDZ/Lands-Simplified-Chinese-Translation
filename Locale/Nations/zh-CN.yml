        not-trusted: <t:error>The land<t:error_value> <v:land></t> isn't a member of your nation<t:error_value> <v:nation></t>.
        confirm: |
          <t:regular>Please confirm that you want to set land<t:entity_land> <v:land></t> as the new capital of nation<t:entity_nation> <v:nation></t>:
            <hover:show_text:"<t:regular>Click here to confirm this action."><click:run_command:"/<v:fullcmd>"><t:success>✔ Confirm: <t:cmd>/<v:fullcmd> </t><java><t:click>[CLICK]</t></java></click></hover>
