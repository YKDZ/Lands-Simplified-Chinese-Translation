        <t:error>No nation found for nation chat.
          <hover:show_text:"<t:regular>Click here to deactivate the chat mode."><click:run_command:"/<v:cmd>"><t:regular>✖ <t:regular>Disable chat mode: <t:cmd>/<v:cmd> </t><java><t:click>[CLICK]</t></java></click></hover>
