nations:
  message:
    current-war: <t:error>你现在不能这么做. <t:regular>你的联邦<t:entity_nation> <v:nation></t>
      目前正处于战争状态. <t:regular>请在战争结束后重试.
    untrusted: <t:error>你不是联邦<t:error_value> <v:nation></t> 的成员.
  command:
    general:
      none: |
        <t:error>你的城镇<t:error_value> <v:land></t> 不属于任何联邦.

          <t:regular>任何联邦都可以邀请你的城镇: <t:cmd>/<v:cmd_trust>
          </t><hover:show_text:"<t:regular>点击复制."><click:suggest_command:"/<v:cmd>"><t:regular>创建自己的联邦: <t:cmd>/<v:cmd> </t><t:click>[点击]</t></click></hover>
    create:
      camp: |
        <t:error>你不能以露营地 <t:decoration>(</t><t:error_value><v:land></t>) <t:error>作为首都建立联邦.
          <hover:show_text:"<t:regular>创建城镇. 点击复制."><click:suggest_command:"/<v:cmd_create>"><t:regular>✖ 创建城镇: <t:cmd>/<v:cmd_create> </t><t:click>[点击]</t></click></hover>
      already: <t:error>你的城镇<t:error_value> <v:land></t> 已经属于联邦<t:error_value> <v:nation></t>.
        <t:regular>你的城镇需要先退出该联邦, 执行 <t:cmd>/<v:cmd></t><t:regular>.
      war: <t:error>你不能在以城镇<t:error_value> <v:land></t> 为首都时建立联邦, 因其仍处于与<t:error_value>
        <v:object></t> 的战争中. <t:regular>请在战争结束后重试.
      level: '<t:error>你目前不能建立联邦. <t:regular>你的城镇<t:entity_land> <v:land></t> 至少需要达到<t:regular_value>
        <v:level> </t>级 <t:decoration>(</t><t:regular>当前: <t:regular_value><v:current></t><t:decoration>)</t><t:regular>.'
      success: <t:regular>已成功创建联邦<t:entity_nation> <v:nation></t>, 并将城镇<t:entity_land>
        <v:land></t> 设为首都. <hover:show_text:"<t:regular>打开菜单."><click:run_command:"/<v:cmd>"><t:regular>点击此处打开菜单.</click></hover>
    nation:
      chat:
        activated: <t:regular>成功启用了联邦聊天频道. 在公开聊天中发送消息即可在联邦聊天频道发言.
        deactivated: <t:regular>成功禁用了联邦聊天频道.
        none: |
          <t:error>未找到所属联邦, 无法使用联邦聊天频道.
            <hover:show_text:"<t:regular>点击此处关闭聊天模式."><click:run_command:"/<v:cmd>"><t:regular>✖ <t:regular>关闭聊天模式: <t:cmd>/<v:cmd> </t><t:click>[点击]</t></click></hover>
        format:
          minecraft: <noprefix><t:entity_nation>联邦 <v:nation></t> <t:decoration>|
            </t><t:regular_value><v:player_display></t> »<t:user_content> <v:message></t>
          discord: <noprefix><t:entity_nation>联邦 <v:nation></t> <t:decoration>| </t><t:entity_nation>Discord
            </t><t:regular_value><v:player_display></t> <t:decoration>»</t><t:user_content>
            <v:message></t>
          spy: <noprefix><t:decoration>[</t><t:negative>聊天监听<t:decoration>] </t><t:entity_nation>联邦
            <v:nation> </t>| <t:regular_value><v:player_display> </t>»<t:user_content>
            <v:message></t>
      delete:
        confirm: |
          <t:regular>请点击下方确认解散联邦<t:entity_nation> <v:nation></t>:
            <hover:show_text:"<t:regular>点击此处确认此操作."><click:run_command:"/<v:fullcmd>"><t:success>✔ 确认: <t:cmd>/<v:fullcmd> </t><t:click>[点击]</t></click></hover>
        war: <t:error>当前无法解散你的联邦. <t:regular>联邦<t:entity_nation> <v:nation> </t>正在与
          <v:object><t:regular> 交战. 请在战争结束后重试.
        success: <t:regular>已成功解散此联邦<t:decoration> (</t><t:regular>联邦:<t:entity_nation>
          <v:nation></t><t:decoration>)</t><t:regular>.
      rename:
        success: <t:regular>已成功将此联邦重命名为<t:regular_value> <v:name></t><t:decoration>
          (</t><t:regular>联邦:<t:entity_nation> <v:nation></t><t:decoration>)</t><t:regular>.
          已支付<t:cost> <v:cost></t>.
      member:
        add:
          camp: <t:error>露营地不能成为联邦成员. <t:regular>城镇<t:entity_land> <v:land></t> 是一个露营地.
          max-distance: <t:error>城镇<t:error_value> <v:land></t> 距离联邦<t:error_value>
            <v:nation></t> 的首都太远. <t:regular>最大距离:<t:limit> <v:max> 个方块</t>, 实际距离:<t:regular_value>
            <v:distance> 个方块</t>
          already: <t:error>城镇<t:error_value> <v:land></t> 已经属于联邦<t:error_value> <v:nation></t>.
            <t:regular>需要先执行 <t:cmd>/<v:cmd></t><t:regular>, 让该城镇退出联邦.
          added: <t:regular>已成功将你的城镇<t:entity_land> <v:land></t> 添加为你的联邦<t:entity_nation>
            <v:nation> </t>的成员.
          success: <t:regular>你已成功邀请城镇<t:entity_land> <v:land></t> 加入你的联邦<t:entity_nation>
            <v:nation></t>.
          target: |
            <t:regular>联邦<t:entity_nation> <v:nation></t> 邀请你的城镇<t:entity_land> <v:land></t> 加入该联邦.
              <hover:show_text:"<t:regular>点击此处接受邀请."><click:run_command:"/<v:cmd_accept>"><t:success>✔ 接受: <t:cmd>/<v:cmd_accept> </t><t:click>[点击]</t></click></hover>
              <hover:show_text:"<t:regular>点击此处拒绝邀请."><click:run_command:"/<v:cmd_deny>"><t:negative>✘ 拒绝: <t:cmd>/<v:cmd_deny> </t><t:click>[点击]</t></click></hover>
        remove:
          capital: <t:error>无法将这个城镇移出联邦. <t:regular>城镇<t:entity_land> <v:land></t>
            是联邦<t:entity_nation> <v:nation></t> 的首都.
          already: <t:error>城镇<t:error_value> <v:land></t> 不是联邦<t:error_value> <v:nation></t>
            的成员.
          success: <t:regular>已成功将城镇<t:entity_land> <v:land></t> 移出联邦<t:entity_nation>
            <v:nation></t>.
          noaccess: '<t:error>你无权对联邦<t:error_value> <v:nation> </t>执行此操作. <t:decoration>标志:
            </t><t:regular_value><v:flag></t>'
        setcapital:
          confirm: |
            <t:regular>请确认是否要将城镇<t:entity_land> <v:land></t> 设为联邦<t:entity_nation> <v:nation></t> 的新首都:
              <hover:show_text:"<t:regular>点击此处确认操作."><click:run_command:"/<v:fullcmd>"><t:success>✔ 确认: <t:cmd>/<v:fullcmd> </t><t:click>[点击]</t></click></hover>
          level: '<t:error>无法将城镇<t:error_value> <v:land></t> 设为联邦<t:error_value> <v:nation></t>
            的新首都. <t:regular>城镇等级至少需要达到<t:regular_value> <v:level></t> <t:decoration>(</t><t:regular>当前:
            <t:regular_value><v:current></t><t:decoration>)</t><t:regular>.'
          success: <t:regular>已成功将城镇<t:entity_land> <v:land></t> 设为联邦<t:entity_nation>
            <v:nation></t> 的新首都.
          not-trusted: <t:error>城镇<t:error_value> <v:land></t> 不属于你的联邦<t:error_value>
            <v:nation></t>.

