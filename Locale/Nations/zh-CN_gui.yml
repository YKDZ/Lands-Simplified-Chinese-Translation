# Here you can edit all GUI menus.
#
# If you encounter any issues or have questions:
# Discord: https://discord.incredibleplugins.com
#
# Wiki: https://wiki.incredibleplugins.com/general/menus/gui-menus

general:
  nation:
    role:
      capital: <t:entity_land><b>首都</t>
      land: <t:entity_land><b>城镇</t>

gui:
  nation:
    title: <t:menu_title><v:level> <v:nation>
    items:
      default:
        role:
          name: <t:regular_heading>联邦职位
          lore:
          - <t:decoration>✖ </t><t:regular>为联邦成员配置
          - '   在该联邦的每个城镇中'
          - '   可执行的操作.'
          material: INHERIT
          slots: 30
        level:
          name: <t:regular_heading>等级
          lore:
          - <t:decoration>✖ </t><t:regular>查看升级进度和属性.
          material: EXPERIENCE_BOTTLE
          slots: 15
        war:
          name: <t:negative_heading>战争进行中
          lore:
          - <t:decoration>✖ </t><t:regular>查看当前战争的信息.
          material: IRON_SWORD
          slots: 12
        taxes:
          name: <t:regular_heading>税费
          lore:
          - <t:decoration>✖ </t><t:regular>按规模向此联邦内的
          - '   城镇征收税费.'
          material: GOLD_INGOT
          slots: 29
        child_failure_spawn_teleport:
          name: <t:error_heading>不允许传送
          lore:
          - <t:error>你无权传送到
          - 联邦首都的传送点.
          - ' <t:decoration>• </t><t:regular>首都所有者可以为你的'
          - '   职位授予此权限.'
        effects:
          name: <t:regular_heading>效果
          lore:
          - <t:decoration>✖ </t><t:regular>设置在你的联邦内启用的效果.
          - '   这些效果可通过提升联邦等级解锁.'
          material: POTION
          slots: 31
        spawn:
          name: <t:regular_heading>首都传送
          lore:
          - <t:decoration>✖ </t><t:regular>传送到联邦首都的传送点.
          material: ENDER_PEARL
          slots: 9
        stats:
          name: <t:regular_heading>统计数据
          lore:
          - '<t:regular>成员总数: <t:regular_value><v:members></t>'
          - ''
          - <t:regular_heading>经济状况</t>
          - ' <t:decoration>• </t><t:regular>联邦'
          - '   余额: <t:regular_value><v:balance></t>'
          - '   联邦需支付<t:cost> <v:upkeep> </t>维护费,'
          - '   将在<t:time> <v:upkeep_next> </t>后支付.'
          - ' <t:decoration>• </t><t:regular>下次向城镇收税的时间为'
          - <t:time><v:upkeep_next_land></t>.
          material: skin:d01afe973c5482fdc71e6aa10698833c79c437f21308ea9a1a095746ec274a0f
          slots: 16
        lands:
          name: <t:regular_heading>城镇列表
          lore:
          - <t:decoration>✖ </t><t:regular>管理属于此联邦的城镇.
          material: skin:8449b9318e33158e64a46ab0de121c3d40000e3332c1574932b3c849d8fa0dc2
          slots: 11
        no-war:
          name: <t:positive_heading>和平
          lore:
          - <t:regular>你的联邦目前未参与任何战争. 一切安宁.
          material: WOODEN_SWORD
          slots: 12
        relations:
          name: <t:regular_heading>外交关系
          lore:
          - <t:decoration>✖ </t><t:regular>管理你与其他
          - '   城镇和联邦之间的外交关系.'
          material: LIME_BANNER
          slots: 14
        inbox:
          name: <t:regular_heading>日志箱</t> <t:decoration>(</t><t:regular_value><v:amount></t><t:decoration>)</t>
          lore:
          - <t:decoration>✖ </t><t:regular>查看日志箱中的消息.
          - ''
          - <t:regular_value><v:inbox></t>
          material: skin:6bf3fcdccffd963e4334818108e1e9ae3a80566d0d3d2d4ab3051a2cd811348c
          slots: 13
        various:
          name: <t:regular_heading>杂项设置
          lore:
          - <t:decoration>✖ </t><t:regular>编辑联邦名称, 标签图标等.
          material: BEACON
          slots: 32
        child_failure_spawn_none:
          name: <t:error_heading>无传送点
          lore:
          - <t:error>联邦首都尚未设置传送点.
          - ' <t:decoration>• </t><t:regular>设置传送点:'
          - '   <t:cmd>/<v:cmd></t>'
  nation_various:
    title: <t:menu_title>杂项
    items:
      default:
        object_name:
          slots: 20
        object_tag:
          slots: 23
        object_icon:
          slots: 26
  list_nation_effects:
    title: <t:menu_title>加成
    items:
      default:
        child_failure_max:
          name: <t:error_heading>最大效果数
          lore:
          - <t:error>你的联邦已达到同时激活<t:error_value> <v:max> </t>个效果的上限.
          - ' <t:decoration>• </t><t:regular>提升联邦等级后, 你可以同时'
          - '   激活更多效果.'
        child_failure_locked:
          name: <t:error_heading>等级过低
          lore:
          - <t:error>你的联邦需要达到
          - 等级<t:error_value> <v:level> </t>后
          - 才能激活此效果.
        entry_object:
          name: '<t:entry_heading><v:effect>: <v:active>'
          lore:
          - <t:decoration>✖ </t><t:regular>是否应在你的联邦
          - '   城镇内启用此效果?'
          material: POTION
        entry_object_locked:
          name: <t:entry_heading><v:effect>
          lore:
          - '<t:regular>解锁等级: <t:regular_value><v:level></t>'
          material: POTION
        entry_object_active:
          name: '<t:entry_heading><v:effect>: <v:active>'
          lore:
          - <t:decoration>✖ </t><t:regular>是否应在你的联邦
          - '   城镇内启用此效果?'
          enchanted: true
          material: POTION
  list_nation_lands:
    title: <t:menu_title>联邦城镇
    items:
      default:
        add:
          name: <t:positive_heading>邀请城镇
          lore:
          - <t:decoration>✖ </t><t:regular>邀请城镇加入你的联邦.
          - '   可用:<t:regular_value> <v:lands></t> <t:decoration>/</t><t:limit> <v:max></t>'
          material: skin:ffec3d25ae0d147c342c45370e0e43300a4e48a5b43f9bb858babff756144dac
          slots: 39
        members_online:
          name: <t:regular_heading>在线成员
          lore:
          - <t:decoration>✖ </t><t:regular>查看在线成员.
          material: CLOCK
          slots: 41
        entry_object:
          name: <t:entry_heading><v:land>
          lore:
          - '<t:regular>标题:'
          - <t:user_content><v:title></t>
          - ''
          - <t:decoration>✖ </t><t:click>左键</t>
          - '   <t:regular>查看信息.'
          - <t:decoration>✖ </t><t:click>丢弃键</t>
          - '   <t:regular>将城镇移出联邦.'
          material: INHERIT
          bedrock:
            detail: true
        remove:
          name: <t:negative_heading>移除城镇
          lore:
          - <t:decoration>✖ </t><t:regular>将城镇移出你的联邦.
          material: skin:548d7d1e03e1af145b0125ab841285672b421265da2ab915015f9058438ba2d8
          slots: 43
  list_player_nations:
    title: <t:menu_title>你的联邦
    items:
      default:
        entry_nation_own:
          name: <t:entry_heading><v:nation>
          lore:
          - <t:regular>你拥有这个联邦.
          - ' <t:decoration>• </t><t:regular>城镇: <t:regular_value><v:lands></t>'
          - ' <t:decoration>• </t><t:regular>区块数: <t:regular_value><v:chunks></t>'
          - ' <t:decoration>• </t><t:regular>成员数: <t:regular_value><v:members></t>'
          - <t:decoration>✖ </t><t:regular>打开联邦菜单.
          - <t:decoration>✖ </t><t:click>右键</t>
          - '   <t:regular>查看联邦概况信息.'
          material: INHERIT
          bedrock:
            detail: true
        entry_nation:
          name: <t:entry_heading><v:nation>
          lore:
          - <t:regular>你是这个联邦的成员.
          - ' <t:decoration>• </t><t:regular>城镇: <t:regular_value><v:lands></t>'
          - ' <t:decoration>• </t><t:regular>区块数: <t:regular_value><v:chunks></t>'
          - ' <t:decoration>• </t><t:regular>成员数: <t:regular_value><v:members></t>'
          - <t:decoration>✖ </t><t:regular>打开联邦菜单.
          - <t:decoration>✖ </t><t:click>右键</t>
          - '   <t:regular>查看联邦概况信息.'
          material: INHERIT
          bedrock:
            detail: true
        entry_nation_edit:
          material: skin:eef425b4db7d62b200e89c013e421a9e110bfb27f2d8b9f5884d10104d00f4f4
