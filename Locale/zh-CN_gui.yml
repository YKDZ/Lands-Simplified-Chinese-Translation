      no_permission: <t:error>You aren't allowed to level up.
      not_enough_money: <t:error>The bank doesn't have enough money.
      requirements_not_met: <t:error>Not all requirements are met.
      success: <t:positive>Leveled up.

physical:
  selection:
    name: <t:regular_heading>选区工具
    lore:
      - <t:regular>Use this tool to create a selection.
      - "Selections can be used for:"
      - " <t:decoration>• </t><t:regular>Claiming"
      - " <t:decoration>• </t><t:regular>Unclaiming"
      - " <t:decoration>• </t><t:regular>Resizing areas"
    material: GOLDEN_HOE
  currency:
    material: GOLD_INGOT
  claim_block_radius:
    name: <t:regular_heading>范围占领方块
    lore:
      - <t:regular>You can claim a radius of
      - chunks by placing this block
      - in the wilderness.
      - ""
      - " <t:decoration>• </t><t:regular>Owner:<t:regular_value> <v:owner></t>"
      - " <t:decoration>• </t><t:regular>Radius:<t:regular_value> <v:radius></t> <t:decoration>(</t><t:regular_value>= <v:chunks> chunks</t><t:decoration>)</t>"
    material: GRASS_BLOCK
  claim_block:
    name: <t:regular_heading>占领方块
    lore:
      - <t:regular>You can claim a chunk
      - by placing this block
      - in the wilderness.
      - ""
      - " <t:decoration>• </t><t:regular>Owner:<t:regular_value> <v:owner></t>"
    material: GRASS_BLOCK
  info:
    name: <t:regular_heading>信息工具
    lore:
      - <t:regular>Use this tool to get
      - information about the claim
      - you're pointing at.
    material: FEATHER
  camp:
    name: <t:regular_heading>露营地
    lore:
      - <t:regular>Place this item to create a temporary
      - camp that will be deleted after
      - <t:time><v:time></t>.
      - " <t:decoration>• </t><t:regular>Radius:<t:regular_value> <v:radius></t>"
      - " <t:decoration>• </t><t:regular>Camps can't be expanded."
    material: CAMPFIRE
  main_block:
    material: BELL
common:
  items:
    default:
      child_failure_message:
        name: <t:error_heading>失败
        lore:
          - <t:error><v:message></t>
      child_success_message:
        name: <t:success_heading>成功
        lore:
          - <t:success><v:message></t>
      child_failure_teleport:
        name: <t:error_heading>传送失败
        lore:
          - <t:error>The teleportation failed because of
          - "the following cause: <t:error_value><v:result></t>"
      child_failure_player_trusted:
        name: <t:error_heading>已加入
        lore:
          - <t:error>You're already part of this land.
      child_failure_permission:
        name: <t:error_heading>权限不足
        lore:
          - <t:error>You're not allowed to do this.
      child_failure_teleport_enter:
        name: <t:error_heading>不允许进入
        lore:
          - <t:error>You're not allowed to enter the
          - area, in which the destination
          - is located.
          - " <t:decoration>• </t><t:regular>The land owner can give you"
          - "   permission to do so."
      refresh_page_previous:
        name: <t:regular_heading>上一页
        lore:
          - "<t:decoration>✖ </t><t:regular>Current: <t:regular_value><v:current></t> / <t:regular_value><v:pages></t>"
        material: ARROW
        slots: 38
        bedrock:
          order: last-2
      child_failure_no-item:
        name: <t:error_heading>光标处无物品
        lore:
          - <t:error>You need to drag an item
          - from your inventory here.
      child_failure_spawn_cooldown:
        name: <t:error_heading>冷却中
        lore:
          - <t:error>You must wait another<t:error_value> <v:time></t>
          - before you can teleport to a
          - spawn again.
      child_failure_teleport_unsafe:
        name: <t:error_heading>不安全
        lore:
          - <t:error>Couldn't teleport to this destination,
          - because it's not safe.
      back:
        name: <t:regular_heading>返回
        lore:
          - <t:decoration>✖ </t><t:regular>Go back to
          - "   <t:regular_value><v:back></t>."
        material: RED_STAINED_GLASS_PANE
        slots: 37
        bedrock:
          order: last
      refresh_page_next:
        name: <t:regular_heading>下一页
        lore:
          - "<t:decoration>✖ </t><t:regular>Current: <t:regular_value><v:current></t> / <t:regular_value><v:pages></t>"
        material: ARROW
        slots: 44
        bedrock:
          order: last-1
      child_failure_cost:
        name: <t:error_heading>余额不足
        lore:
          - <t:error>You need <t:cost><v:cost></t> to do this.
      child_failure_spawn_cost:
        name: <t:error_heading>余额不足
        lore:
          - <t:error>You need <t:cost><v:cost></t> to pay for
          - the teleportation.
      child_failure_noaccess_owner:
        name: <t:error_heading>无权操作
        lore:
          - <t:error>Only the owner of <t:error_value><v:object></t> can do that.
      child_failure_spawn_teleport:
        name: <t:error_heading>不允许传送
        lore:
          - <t:error>You're not allowed to teleport
          - to this particular land spawn.
          - " <t:decoration>• </t><t:regular>The land owner can give you"
          - "   permission to do so."
      child_failure_spawn_war:
        name: <t:error_heading>战争进行中
        lore:
          - <t:error>You currently can't teleport to
          - this particular land spawn.
          - " <t:decoration>• </t><t:regular>They're currently engaged in a war,"
          - "   for another <t:time><v:time></t>."
      child_failure_membership-request_not-looking:
        name: <t:error_heading>未招募成员
        lore:
          - <t:error>This land isn't looking for
          - new members.
      child_failure_page_previous:
        name: <t:error_heading>无上一页
      child_success_player_trusted:
        name: <t:success_heading>你已加入
        lore:
          - <t:success>Land <t:entity_land><v:land></t> automatically
          - accepted your request.
          - " <t:decoration>• </t><t:regular>Leave a land: <t:cmd>/<v:cmd></t>"
      child_failure_page_next:
        name: <t:error_heading>无下一页
      child_success_membership-request_revoked:
        name: <t:success_heading>已撤回加入申请
        lore:
          - <t:success>You revoked your membership request.
      child_failure_noaccess:
        name: <t:error_heading>无权操作
        lore:
          - <t:error>You're not allowed to do that.
          - " <t:decoration>• </t><t:regular>The owner of <v:object><t:regular> can give your"
          - "   role permission to do so."
          - "   Flag: <t:regular_value><v:flag></t>"
      child_success_membership-request_sent:
        name: <t:success_heading>已发送加入申请
        lore:
          - <t:regular>They can now accept your membership request.
      child_failure_spawn_none:
        name: <t:error_heading>无传送点
        lore:
          - <t:error>This land doesn't have set a spawn yet.
          - " <t:decoration>• </t><t:regular>Set spawn point:"
          - "   <t:cmd>/<v:cmd></t>"
      category:
        name: '<t:regular_heading>类别: <v:category>'
        lore:
          - <t:decoration>✖ </t><t:regular>Change the category of the land.
          - "    <t:decoration>• </t><t:regular>Others can filter your land in the"
          - "      <t:regular_value>/<v:cmd></t> menu by this category."
        material: BOOKSHELF
        slots: 40
      category_members:
        name: '<t:regular_heading>类别: <v:category>'
        lore:
          - <t:decoration>✖ </t><t:regular>Change the category of the land.
          - "    <t:decoration>• </t><t:regular>Others can filter your land in the"
          - "      <t:cmd>/<v:cmd></t> menu by this category."
          - ""
          - "    <t:decoration>• </t><t:regular>They can request membership to"
          - "      this land in the menu"
          - "      <t:regular>as long as the category of"
          - "      your land is set to:"
          - "      <t:regular_value><v:looking></t>"
        material: BOOKSHELF
        slots: 40
      child_failure_global-action:
        name: <t:error_heading>已启用显示所有子区域
        lore:
          - <t:error>Can't disable this, if you're viewing entries
          - for all areas. <t:regular>Enable <t:regular_heading>View only area</t>
          - to change this.
      child_failure_nation_none:
        name: <t:error_heading>职位由联邦管理
        lore:
          - <t:error>This role will be partly managed
          - by the nation you may belong to in the future.
          - " <t:decoration>• </t><t:regular>You're currently not part of any nation."
      object_name:
        name: '<t:regular_heading>名称: <t:user_content><v:name></t>'
        lore:
          - <t:decoration>✖ </t><t:regular>Set a new name.
        material: PAPER
      object_tag:
        name: '<t:regular_heading>标签: <t:user_content><v:tag></t>'
        lore:
          - <t:regular>A short version of the name.
          - <action:primary><label>Set Tag</label></action>
          - <action:remove><label>Remove Tag</label></action>
        material: NAME_TAG
      object_icon:
        name: <t:regular_heading>图标
        lore:
          - <action:primary><label>Set Icon</label><desc>Drag an item here, or hold it in your hand on Bedrock.</desc></action>
          - <action:remove><label>Reset to Default</label></action>
        material: INHERIT
      placeholder_1:
        material: GRAY_STAINED_GLASS_PANE
        hide-tooltip: true
        slots: 1-45
  size: 45
  entries: 10-36
  auto-correct: true
gui:
  area_various:
    title: <t:menu_title>杂项
    items:
      default:
        child_no-item:
          name: <t:error_heading>手中无物品
          lore:
            - <t:regular>You need to have an item
            - in your main hand.
        name:
          name: <t:regular_heading>名称
          lore:
            - <t:decoration>✖</t> <t:regular>Rename this area.
            - "   Current: <t:user_content><v:name></t>"
          material: NAME_TAG
          slots: 20
        icon:
          name: <t:regular_heading>图标
          lore:
            - <t:decoration>✖ </t><t:regular>Drag an item here to change the icon.
            - "    <t:decoration>• </t><t:regular>This helps you to recognize"
            - "      this area in the areas menu."
          material: INHERIT
          slots: 26
        description:
          name: <t:regular_heading>描述
          lore:
            - <t:decoration>✖ </t><t:regular>Change the description of
            - "   this area."
            - "   <t:decoration>• </t><t:regular><b>Current:"
            - "     <t:user_content><v:description></t>"
          material: OAK_SIGN
          slots: 23
  role:
    title: <t:menu_title><v:role>
    items:
      default:
        taxes_never:
          name: <t:regular_heading>此职位无需缴纳税费
          lore:
            - <t:regular>It can't be changed for this role.
          material: GOLD_INGOT
          slots: 15
        settings:
          name: <t:regular_heading>行为设置
          lore:
            - <t:decoration>✖ </t><t:regular>Toggle action flags like block breaking,
            - "   container opening etc."
          material: IRON_PICKAXE
          slots: 29
        apply:
          name: '<t:regular_heading>添加到新子区域: <v:apply>'
          lore:
            - <t:decoration>✖ </t><t:regular>Should this role, including
            - "   its members and flags, be added"
            - "   to new area creations?"
          material: OAK_FENCE
          slots: 14
        members_ally:
          name: <t:regular_heading>职位成员
          lore:
            - <t:regular>All players that aren't trusted
            - and are part of an ally land, have
            - this role assigned.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        icon:
          name: <t:regular_heading>图标
          lore:
            - <action:primary><label>Set Icon</label><desc>Drag an item here to change the role icon.</desc></action>
            - <action:remove><label>Reset to Default</label></action>
          material: INHERIT
          slots: 13
          bedrock:
            detail: true
        taxes:
          name: '<t:regular_heading>缴纳税费: <v:current>'
          lore:
            - <t:decoration>✖ </t><t:regular>Should members of this role
            - "   pay taxes?"
            - "   <t:decoration>• </t><t:regular>The land receives<t:regular_value> <v:taxes> <t:regular>in taxes"
            - "     from this role and area in"
            - "     <t:time><v:time></t>."
          material: GOLD_INGOT
          slots: 15
        apply_always:
          name: <t:regular_heading>自动添加职位到新子区域
          lore:
            - <t:regular>This role, including its members
            - and flags, is always added to new
            - area creations. That can't be
            - toggled for this role.
          material: OAK_FENCE
          slots: 14
        members_visitor:
          name: <t:regular_heading>职位成员
          lore:
            - <t:regular>All players that aren't trusted
            - have this role assigned.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        child_failure_priority:
          name: <t:error_heading>职位优先级不足
          lore:
            - <t:error>You're not allowed to edit
            - settings of this role.
            - " <t:decoration>• </t><t:regular>It has a higher priority than"
            - "   yours or you're a member of"
            - "   this role."
        members_nation:
          name: <t:regular_heading>职位成员
          lore:
            - <t:regular>All players that aren't trusted
            - and are part of your nation, have
            - this role assigned.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        child_failure_access:
          name: <t:error_heading>职位权限不足
          lore:
            - <t:error>You're not allowed to edit
            - roles in this area.
            - " <t:decoration>• </t><t:regular>The land owner can give your"
            - "   role permission to do so."
        management:
          name: <t:regular_heading>管理设置
          lore:
            - <t:decoration>✖ </t><t:regular>Toggle administrative flags like
            - "   trusting players, claiming etc."
          material: GOLD_INGOT
          slots: 30
        members:
          name: <t:regular_heading>职位成员
          lore:
            - <t:decoration>✖ </t><t:regular>View all role members.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        name:
          name: <t:regular_heading>重命名
          lore:
            - <t:decoration>✖ </t><t:regular>Rename this role.
            - "   Current: <t:user_content><v:name></t>"
          material: NAME_TAG
          slots: 12
        child_failure_nation:
          name: <t:error_heading>职位由联邦管理
          lore:
            - <t:error>This role is partly managed
            - by your nation.
            - " <t:decoration>• </t><t:regular>Only the nation's capital can change"
            - "   this setting: <t:cmd>/<v:cmd></t>"
  list_area_invites:
    title: <t:menu_title>已发送的邀请和请求
    items:
      default:
        entry_object_owner_land:
          name: <t:entry_heading><v:player> <t:decoration>-</t> 所有权请求
          lore:
            - <t:regular>Sets this player as the new owner
            - of land <t:entity_land><v:land></t>.
            - ""
            - <t:regular_heading>Information</t>
            - " <t:decoration>• </t><t:regular>Sent:<t:time> <v:time></t>"
            - " <t:decoration>• </t><t:regular>Sender: <v:sender>"
            - ""
            - <action:remove><label>Revoke Invitation</label></action>
        entry_object_merge:
          name: <t:entry_heading><v:merge> <t:decoration>-</t> 合并请求
          lore:
            - <t:regular>Merges the land<t:entity_land> <v:merge></t> into this.
            - ""
            - <t:regular_heading>Information</t>
            - " <t:decoration>• </t><t:regular>Sent:<t:time> <v:time></t>"
            - " <t:decoration>• </t><t:regular>Sender: <v:sender>"
            - " <t:decoration>• </t><t:regular>Receiver: <t:regular_value><v:receiver></t>"
            - ""
            - <action:remove><label>Revoke Invitation</label></action>
          material: INHERIT
        entry_object_trust_area:
          name: <t:entry_heading><v:player> <t:decoration>-</t> <t:regular_heading>成员邀请
          lore:
            - <t:regular>Adds this player to the area <t:regular_value><v:area></t>.
            - ""
            - <t:regular_heading>Information</t>
            - " <t:decoration>• </t><t:regular>Sent:<t:time> <v:time></t>"
            - " <t:decoration>• </t><t:regular>Sender: <v:sender>"
            - ""
            - <action:remove><label>Revoke Invitation</label></action>
          material: INHERIT
        child_failure_access:
          name: <t:error_heading>职位权限不足
          lore:
            - <t:error>You're not allowed to revoke
            - invites in this area.
            - " <t:decoration>• </t><t:regular>The land owner can give your role"
            - "   permission to remove players."
        entry_object_trust_land:
          name: <t:entry_heading><v:player> <t:decoration>-</t> 成员邀请
          lore:
            - <t:regular>Adds this player to the whole
            - land <t:entity_land><v:land></t>.
            - ""
