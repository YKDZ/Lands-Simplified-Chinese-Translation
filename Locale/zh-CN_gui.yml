physical:
  selection:
    name: <t:regular_heading>选区工具
    lore:
      - <t:regular>使用此工具创建选区.
      - "选区可用于:"
      - " <t:decoration>• </t><t:regular>占领区块"
      - " <t:decoration>• </t><t:regular>取消占领区块"
      - " <t:decoration>• </t><t:regular>调整子区域大小"
    material: GOLDEN_HOE
  currency:
    material: GOLD_INGOT
  claim_block_radius:
    name: <t:regular_heading>范围占领方块
    lore:
      - <t:regular>使用此方块可以占领一定半径内的区块.
      - "将此方块放置在荒野中即可完成占领."
      - ""
      - " <t:decoration>• </t><t:regular>所有者:<t:regular_value> <v:owner></t>"
      - " <t:decoration>• </t><t:regular>半径:<t:regular_value> <v:radius></t> <t:decoration>(</t><t:regular_value>= <v:chunks> 个区块</t><t:decoration>)</t>"
    material: GRASS_BLOCK
  claim_block:
    name: <t:regular_heading>占领方块
    lore:
      - <t:regular>使用此方块可以占领一个领土区块.
      - "将此方块放置在荒野中即可完成占领."
      - ""
      - " <t:decoration>• </t><t:regular>所有者:<t:regular_value> <v:owner></t>"
    material: GRASS_BLOCK
  info:
    name: <t:regular_heading>信息工具
    lore:
      - <t:regular>使用此工具查看所指位置的领土信息.
    material: FEATHER
  camp:
    name: <t:regular_heading>露营地
    lore:
      - <t:regular>放置此物品创建临时露营地,
      - "露营地到期后将自动解散"
      - <t:time><v:time></t>.
      - " <t:decoration>• </t><t:regular>半径:<t:regular_value> <v:radius></t>"
      - " <t:decoration>• </t><t:regular>露营地无法扩展."
    material: CAMPFIRE
  main_block:
    material: BELL
common:
  items:
    default:
      child_failure_message:
        name: <t:error_heading>失败
        lore:
          - <t:error><v:message></t>
      child_success_message:
        name: <t:success_heading>成功
        lore:
          - <t:success><v:message></t>
      child_failure_teleport:
        name: <t:error_heading>传送失败
        lore:
          - "<t:error>传送失败, 原因如下:"
          - "<t:error_value><v:result></t>"
      child_failure_player_trusted:
        name: <t:error_heading>已加入
        lore:
          - <t:error>你已是该城镇的成员.
      child_failure_permission:
        name: <t:error_heading>权限不足
        lore:
          - <t:error>你无权执行此操作.
      child_failure_teleport_enter:
        name: <t:error_heading>不允许进入
        lore:
          - <t:error>你无权进入目标所在的子区域.
          - " <t:decoration>• </t><t:regular>城镇所有者可以授予你相应权限."
      refresh_page_previous:
        name: <t:regular_heading>上一页
        lore:
          - "<t:decoration>✖ </t><t:regular>当前页: <t:regular_value><v:current></t> / <t:regular_value><v:pages></t>"
        material: ARROW
        slots: 38
        bedrock:
          order: last-2
      child_failure_no-item:
        name: <t:error_heading>光标处无物品
        lore:
          - <t:error>请从物品栏中将物品拖到这里.
      child_failure_spawn_cooldown:
        name: <t:error_heading>冷却中
        lore:
          - <t:error>还需等待<t:error_value> <v:time></t>
          - 才能再次传送到传送点.
      child_failure_teleport_unsafe:
        name: <t:error_heading>不安全
        lore:
          - <t:error>无法传送到此位置, 因为这里不安全.
      back:
        name: <t:regular_heading>返回
        lore:
          - <t:decoration>✖ </t><t:regular>返回到
          - "   <t:regular_value><v:back></t>."
        material: RED_STAINED_GLASS_PANE
        slots: 37
        bedrock:
          order: last
      refresh_page_next:
        name: <t:regular_heading>下一页
        lore:
          - "<t:decoration>✖ </t><t:regular>当前页: <t:regular_value><v:current></t> / <t:regular_value><v:pages></t>"
        material: ARROW
        slots: 44
        bedrock:
          order: last-1
      child_failure_cost:
        name: <t:error_heading>余额不足
        lore:
          - <t:error>执行此操作需要<t:cost> <v:cost></t>.
      child_failure_spawn_cost:
        name: <t:error_heading>余额不足
        lore:
          - <t:error>传送费用需要<t:cost> <v:cost></t>.
      child_failure_noaccess_owner:
        name: <t:error_heading>无权操作
        lore:
          - <t:error>只有<t:error_value> <v:object></t> 的所有者才能执行此操作.
      child_failure_spawn_teleport:
        name: <t:error_heading>不允许传送
        lore:
          - <t:error>你无权传送到此城镇的传送点.
          - " <t:decoration>• </t><t:regular>请联系城镇所有者授权."
      child_failure_spawn_war:
        name: <t:error_heading>战争进行中
        lore:
          - <t:error>你目前无法传送到此城镇的传送点.
          - " <t:decoration>• </t><t:regular>该城镇正在参与战争,"
          - "   还需等待<t:time> <v:time></t>."
      child_failure_membership-request_not-looking:
        name: <t:error_heading>未招募成员
        lore:
          - <t:error>该城镇暂不招募新成员.
      child_failure_page_previous:
        name: <t:error_heading>无上一页
      child_success_player_trusted:
        name: <t:success_heading>你已加入
        lore:
          - <t:success>城镇<t:entity_land> <v:land></t> 已自动接受你的申请.
          - " <t:decoration>• </t><t:regular>离开城镇: <t:cmd>/<v:cmd></t>"
      child_failure_page_next:
        name: <t:error_heading>无下一页
      child_success_membership-request_revoked:
        name: <t:success_heading>已撤回加入申请
        lore:
          - <t:success>已撤回你的成员申请.
      child_failure_noaccess:
        name: <t:error_heading>无权操作
        lore:
          - <t:error>你无权执行此操作.
          - " <t:decoration>• </t><t:regular><v:object><t:regular> 的所有者可以授予你的职位相应权限."
          - "   设置: <t:regular_value><v:flag></t>"
      child_success_membership-request_sent:
        name: <t:success_heading>已发送加入申请
        lore:
          - <t:regular>对方现在可以接受你的成员申请.
      child_failure_spawn_none:
        name: <t:error_heading>无传送点
        lore:
          - <t:error>该城镇尚未设置传送点.
          - " <t:decoration>• </t><t:regular>设置传送点:"
          - "   <t:cmd>/<v:cmd></t>"
      category:
        name: "<t:regular_heading>类别: <v:category>"
        lore:
          - <t:decoration>✖ </t><t:regular>更改城镇类别.
          - "    <t:decoration>• </t><t:regular>其他玩家可以筛选你的城镇"
          - "      在 <t:regular_value>/<v:cmd></t> 菜单中按类别筛选."
        material: BOOKSHELF
        slots: 40
      category_members:
        name: "<t:regular_heading>类别: <v:category>"
        lore:
          - <t:decoration>✖ </t><t:regular>更改城镇类别.
          - "    <t:decoration>• </t><t:regular>其他玩家可以在"
          - "      <t:cmd>/<v:cmd></t> 中按类别筛选城镇."
          - ""
          - "    <t:decoration>• </t><t:regular>若将你的城镇设为以下类别,"
          - "      其他玩家就可以在城镇菜单中"
          - "      <t:regular>向你的城镇提交加入申请:"
          - "      <t:regular_value><v:looking></t>"
        material: BOOKSHELF
        slots: 40
      child_failure_global-action:
        name: <t:error_heading>已启用显示所有子区域
        lore:
          - <t:error>查看所有子区域时, 无法更改此设置.
          - " <t:regular>请启用<t:regular_heading>仅查看当前子区域</t>"
          - 再进行更改.
      child_failure_nation_none:
        name: <t:error_heading>职位由联邦管理
        lore:
          - <t:error>此职位将由你未来可能加入的联邦管理一部分
          - " <t:decoration>• </t><t:regular>你目前尚未加入任何联邦."
      object_name:
        name: "<t:regular_heading>名称: <t:user_content><v:name></t>"
        lore:
          - <t:decoration>✖ </t><t:regular>设置新名称.
        material: PAPER
      object_tag:
        name: "<t:regular_heading>标签: <t:user_content><v:tag></t>"
        lore:
          - <t:regular>名称的简短形式.
          - <action:primary><label>设置标签</label></action>
          - <action:remove><label>移除标签</label></action>
        material: NAME_TAG
      object_icon:
        name: <t:regular_heading>图标
        lore:
          - <action:primary><label>设置图标</label><desc>将物品拖到此处; 基岩版玩家也可以手持物品操作.</desc></action>
          - <action:remove><label>恢复默认</label></action>
        material: INHERIT
      placeholder_1:
        material: GRAY_STAINED_GLASS_PANE
        hide-tooltip: true
        slots: 1-45
  size: 45
  entries: 10-36
  auto-correct: true
gui:
  area_various:
    title: <t:menu_title>杂项
    items:
      default:
        child_no-item:
          name: <t:error_heading>手中无物品
          lore:
            - <t:regular>请将物品放在主手中.
        name:
          name: <t:regular_heading>名称
          lore:
            - <t:decoration>✖</t> <t:regular>重命名此子区域.
            - "   当前名称: <t:user_content><v:name></t>"
          material: NAME_TAG
          slots: 20
        icon:
          name: <t:regular_heading>图标
          lore:
            - <t:decoration>✖ </t><t:regular>将物品拖到此处以更改图标.
            - "    <t:decoration>• </t><t:regular>这有助于你在子区域菜单中"
            - "      找到此子区域."
          material: INHERIT
          slots: 26
        description:
          name: <t:regular_heading>描述
          lore:
            - "<t:decoration>✖ </t><t:regular>更改子区域描述:"
            - "   <t:decoration>• </t><t:regular><b>当前:"
            - "     <t:user_content><v:description></t>"
          material: OAK_SIGN
          slots: 23
  role:
    title: <t:menu_title><v:role>
    items:
      default:
        taxes_never:
          name: <t:regular_heading>此职位无需缴纳税费
          lore:
            - <t:regular>此职位的税额无法更改.
          material: GOLD_INGOT
          slots: 15
        settings:
          name: <t:regular_heading>行为设置
          lore:
            - <t:decoration>✖ </t><t:regular>切换方块破坏, 容器开启等操作标记.
            - ""
          material: IRON_PICKAXE
          slots: 29
        apply:
          name: "<t:regular_heading>添加到新子区域: <v:apply>"
          lore:
            - <t:decoration>✖ </t><t:regular>创建新子区域时, 是否自动添加此职位?
            - "   同时添加其成员和权限设置"
            - "   到新建的子区域中?"
          material: OAK_FENCE
          slots: 14
        members_ally:
          name: <t:regular_heading>职位成员
          lore:
            - <t:regular>所有未加入城镇且属于盟友城镇的玩家都会被分配此职位.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        icon:
          name: <t:regular_heading>图标
          lore:
            - <action:primary><label>设置图标</label><desc>将物品拖到此处以更改职位图标.</desc></action>
            - <action:remove><label>恢复默认</label></action>
          material: INHERIT
          slots: 13
          bedrock:
            detail: true
        taxes:
          name: "<t:regular_heading>缴纳税费: <v:current>"
          lore:
            - <t:decoration>✖ </t><t:regular>此职位成员是否需要缴纳税费?
            - "   <t:decoration>• </t><t:regular>每隔 <t:time><v:time></t>,"
            - "     <t:regular>城镇将收到此职位和子区域成员缴纳的 <t:regular_value> <v:taxes> 税费."
          material: GOLD_INGOT
          slots: 15
        apply_always:
          name: <t:regular_heading>自动将职位添加到新子区域
          lore:
            - <t:regular>此职位(包括其成员和设置)始终会被添加到新创建的子区域中.
            - 对于此职位, 该设置无法切换.
          material: OAK_FENCE
          slots: 14
        members_visitor:
          name: <t:regular_heading>职位成员
          lore:
            - <t:regular>所有未加入城镇的玩家都会被分配此职位.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        child_failure_priority:
          name: <t:error_heading>职位优先级不足
          lore:
            - <t:error>你无权编辑此职位的设置.
            - " <t:decoration>• </t><t:regular>此职位的优先级等于或高于你的职位."
        members_nation:
          name: <t:regular_heading>职位成员
          lore:
            - <t:regular>所有未加入城镇且属于你所在联邦的玩家都会被分配此职位.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        child_failure_access:
          name: <t:error_heading>职位权限不足
          lore:
            - <t:error>你无权编辑此子区域中的的职位.
            - " <t:decoration>• </t><t:regular>城镇所有者可以授予你的职位相应权限."
        management:
          name: <t:regular_heading>管理设置
          lore:
            - <t:decoration>✖ </t><t:regular>切换管理权限
            - "   例如信任玩家, 邀请玩家, 占领等."
          material: GOLD_INGOT
          slots: 30
        members:
          name: <t:regular_heading>职位成员
          lore:
            - <t:decoration>✖ </t><t:regular>查看该职位的所有成员.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        name:
          name: <t:regular_heading>重命名
          lore:
            - <t:decoration>✖ </t><t:regular>重命名此职位.
            - "   当前名称: <t:user_content><v:name></t>"
          material: NAME_TAG
          slots: 12
        child_failure_nation:
          name: <t:error_heading>职位由联邦管理
          lore:
            - <t:error>此职位部分由你的联邦管理.
            - " <t:decoration>• </t><t:regular>只有联邦首都可以更改此设置:"
