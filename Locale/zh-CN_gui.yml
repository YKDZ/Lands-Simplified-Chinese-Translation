physical:
  selection:
    name: <t:regular_heading>选区工具
    lore:
    - <t:regular>使用此工具创建选区.
    - '选区可用于:'
    - ' <t:decoration>• </t><t:regular>占领'
    - ' <t:decoration>• </t><t:regular>取消占领'
    - ' <t:decoration>• </t><t:regular>调整子区域大小'
    material: GOLDEN_HOE
  currency:
    name: ''
    material: GOLD_INGOT
  claim_block_radius:
    name: <t:regular_heading>范围占领方块
    lore:
    - <t:regular>在荒野中放置此方块
    - 以占领一定半径内的区块.
    - ''
    - ' <t:decoration>• </t><t:regular>所有者:<t:regular_value> <v:owner></t>'
    - ' <t:decoration>• </t><t:regular>半径:<t:regular_value> <v:radius></t> <t:decoration>(</t><t:regular_value>=
      <v:chunks> 个区块</t><t:decoration>)</t>'
    material: GRASS_BLOCK
  claim_block:
    name: <t:regular_heading>占领方块
    lore:
    - <t:regular>放置此方块可占领
    - 一个荒野中的区块.
    - ''
    - ' <t:decoration>• </t><t:regular>所有者:<t:regular_value> <v:owner></t>'
    material: GRASS_BLOCK
  info:
    name: <t:regular_heading>信息工具
    lore:
    - <t:regular>使用此工具查看
    - 你所指向的占领区信息.
    material: FEATHER
  camp:
    name: <t:regular_heading>露营地
    lore:
    - <t:regular>放置此物品以创建将在 <t:time><v:time></t> 后删除
    - 的临时露营地.
    - ' <t:decoration>• </t><t:regular>半径:<t:regular_value> <v:radius></t>'
    - ' <t:decoration>• </t><t:regular>露营地无法扩张.'
    material: CAMPFIRE
  capture_flag:
    material: BEACON
  main_block:
    material: BELL
common:
  items:
    default:
      child_failure_message:
        name: <t:error_heading>失败
        lore:
        - <t:error><v:message></t>
      child_success_message:
        name: <t:success_heading>成功
        lore:
        - <t:success><v:message></t>
      child_failure_teleport:
        name: <t:error_heading>传送失败
        lore:
        - '<t:error>传送失败, 原因如下:'
        - <t:error_value><v:result></t>
      child_failure_player_trusted:
        name: <t:error_heading>已加入
        lore:
        - <t:error>你已经是这个城镇的成员.
      child_failure_permission:
        name: <t:error_heading>权限不足
        lore:
        - <t:error>你无权这样做.
      child_failure_teleport_enter:
        name: <t:error_heading>不允许进入
        lore:
        - <t:error>你无权进入目标所在的子区域.
        - ' <t:decoration>• </t><t:regular>城镇所有者可以授予你该权限.'
      refresh_page_previous:
        name: <t:regular_heading>上一页
        lore:
        - '<t:decoration>✖ </t><t:regular>当前: <t:regular_value><v:current></t> / <t:regular_value><v:pages></t>'
        material: ARROW
        slots: 38
      child_failure_no-item:
        name: <t:error_heading>光标处无物品
        lore:
        - <t:error>你需要将背包中的物品拖到这里.
      child_failure_spawn_cooldown:
        name: <t:error_heading>冷却中
        lore:
        - <t:error>你还需等待<t:error_value> <v:time></t>
        - 才能再次传送到任一城镇传送点.
      child_failure_teleport_unsafe:
        name: <t:error_heading>不安全
        lore:
        - <t:error>无法传送到此目的地,
        - 因为目的地不安全.
      back:
        name: <t:regular_heading>返回
        lore:
        - <t:decoration>✖ </t><t:regular>返回
        - '   <t:regular_value><v:back></t>.'
        material: RED_STAINED_GLASS_PANE
        slots: 37
      refresh_page_next:
        name: <t:regular_heading>下一页
        lore:
        - '<t:decoration>✖ </t><t:regular>当前: <t:regular_value><v:current></t> / <t:regular_value><v:pages></t>'
        material: ARROW
        slots: 44
      child_failure_cost:
        name: <t:error_heading>余额不足
        lore:
        - <t:error>你需要<t:cost> <v:cost> </t>才能这样做.
      child_failure_spawn_cost:
        name: <t:error_heading>余额不足
        lore:
        - <t:error>你需要<t:cost> <v:cost> </t>才能支付
        - 传送费用.
      child_failure_noaccess_owner:
        name: <t:error_heading>无权操作
        lore:
        - <t:error>只有<t:error_value> <v:object> </t>的所有者才能这样做.
      child_failure_spawn_teleport:
        name: <t:error_heading>不允许传送
        lore:
        - <t:error>你无权传送到
        - 该城镇传送点.
        - ' <t:decoration>• </t><t:regular>城镇所有者可以授予你该权限.'
      child_failure_spawn_war:
        name: <t:error_heading>战争进行中
        lore:
        - <t:error>当前无法传送到
        - 该城镇传送点.
        - ' <t:decoration>• </t><t:regular>该城镇目前正处于战争中,'
        - '   还需<t:time> <v:time> </t>才能结束.'
      child_failure_membership-request_not-looking:
        name: <t:error_heading>未招募成员
        lore:
        - <t:error>这个城镇不招募新成员.
      child_failure_page_previous:
        name: <t:error_heading>无上一页
      child_success_player_trusted:
        name: <t:success_heading>你已加入
        lore:
        - <t:success>城镇<t:entity_land> <v:land> </t>已自动
        - 接受了你的请求.
        - ' <t:decoration>• </t><t:regular>离开城镇: <t:cmd>/<v:cmd></t>'
      child_failure_page_next:
        name: <t:error_heading>无下一页
      child_success_membership-request_revoked:
        name: <t:success_heading>已撤回加入申请
        lore:
        - <t:success>你已撤回加入申请.
      child_failure_noaccess:
        name: <t:error_heading>无权操作
        lore:
        - <t:error>你无权这样做.
        - '  <t:decoration>• </t><t:regular>该 <v:object> <t:regular>的所有者可以授予你的'
        - '    职位执行此操作的权限.'
        - '    标志: <t:regular_value><v:flag></t>'
      child_success_membership-request_sent:
        name: <t:success_heading>已发送加入申请
        lore:
        - <t:regular>对方现在可以接受你的加入申请.
      child_failure_spawn_none:
        name: <t:error_heading>无传送点
        lore:
        - <t:error>该城镇尚未设置传送点.
        - '  <t:decoration>• </t><t:regular>设置传送点:'
        - '    <t:cmd>/<v:cmd></t>'
      category:
        name: '<t:regular_heading>类别: <v:category>'
        lore:
        - <t:decoration>✖ </t><t:regular>更改城镇类别.
        - '     <t:decoration>• </t><t:regular>其他人可以在'
        - '       <t:regular_value>/<v:cmd> </t>菜单中按此类别筛选你的城镇.'
        material: BOOKSHELF
        slots: 40
      category_members:
        name: '<t:regular_heading>类别: <v:category>'
        lore:
        - <t:decoration>✖ </t><t:regular>更改城镇类别.
        - '    <t:decoration>• </t><t:regular>其他人可以在'
        - '      <t:cmd>/<v:cmd> </t>菜单中按此类别筛选你的城镇.'
        - ''
        - '    <t:decoration>• </t><t:regular>将你的城镇类别设为:'
        - '      <t:regular_value><v:looking></t>'
        - '      <t:regular>让他人可以在该菜单中申请加入你的城镇.'
        material: BOOKSHELF
        slots: 40
      child_failure_global-action:
        name: <t:error_heading>已启用显示所有子区域
        lore:
        - <t:error>查看所有子区域的条目时无法禁用.
        - <t:regular>启用<t:regular_heading>仅显示子区域</t>后即可更改.
      child_failure_nation_none:
        name: <t:error_heading>职位由联邦管理
        lore:
        - <t:error>该职位将来可能部分
        - 由你加入的联邦管理.
        - '  <t:decoration>• </t><t:regular>你目前不属于任何联邦.'
      object_name:
        name: '<t:regular_heading>名称: <t:user_content><v:name></t>'
        lore:
        - <t:decoration>✖ </t><t:regular>设置新名称.
        material: PAPER
      object_tag:
        name: '<t:regular_heading>标签: <t:user_content><v:tag></t>'
        lore:
        - <t:decoration>✖ </t><t:regular>设置新标签作为名称的简称.
        - ''
        - <t:decoration>✖ </t><t:click>丢弃键</t>
        - '   <t:regular>移除标签.'
        material: NAME_TAG
      object_icon:
        name: <t:regular_heading>图标
        lore:
        - <t:decoration>✖ </t><t:regular>将物品拖到此处以更改
        - '   图标.'
        - <t:decoration>✖ </t><t:click>丢弃键</t>
        - '   <t:regular>重置为默认图标.'
        material: INHERIT
      placeholder_1:
        material: GRAY_STAINED_GLASS_PANE
        hide-tooltip: true
        slots: 1-45
  size: 45
  entries: 10-36
  auto-correct: true
gui:
  area_various:
    title: <t:menu_title>杂项
    items:
      default:
        child_no-item:
          name: <t:error_heading>手中无物品
          lore:
          - <t:regular>你的主手中必须有物品.
        name:
          name: <t:regular_heading>名称
          lore:
          - <t:decoration>✖</t> <t:regular>重命名此子区域.
          - '   当前: <t:user_content><v:name></t>'
          material: NAME_TAG
          slots: 20
        icon:
          name: <t:regular_heading>图标
          lore:
          - <t:decoration>✖ </t><t:regular>将物品拖到此处以更改图标.
          - '    <t:decoration>• </t><t:regular>便于在子区域列表中'
          - '      识别此子区域.'
          material: INHERIT
          slots: 26
        description:
          name: <t:regular_heading>描述
          lore:
          - <t:decoration>✖ </t><t:regular>更改此子区域的描述.
          - '   <t:decoration>• </t><t:regular><b>当前:'
          - '     <t:user_content><v:description></t>'
          material: OAK_SIGN
          slots: 23
  role:
    title: <t:menu_title><v:role>
    items:
      default:
        taxes_never:
          name: <t:regular_heading>此职位无需缴纳税费
          lore:
          - <t:regular>此职位的税费设置无法更改.
          material: GOLD_INGOT
          slots: 15
        settings:
          name: <t:regular_heading>行为设置
          lore:
          - <t:decoration>✖ </t><t:regular>切换行为设置,
          - '   例如破坏方块, 打开容器等.'
          material: IRON_PICKAXE
          slots: 29
        apply:
          name: '<t:regular_heading>添加到新子区域: <v:apply>'
          lore:
          - <t:decoration>✖ </t><t:regular>是否将此职位及其成员和权限添加
          - '   到新创建的子区域中?'
          material: OAK_FENCE
          slots: 14
        members_ally:
          name: <t:regular_heading>职位成员
          lore:
          - <t:regular>所有未加入当前城镇但属于盟友城镇的玩家
          - 都会被分配到此职位.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        icon:
          name: <t:regular_heading>图标
          lore:
          - <t:decoration>✖ </t><t:regular>将物品拖到此处以更改
          - '   职位图标.'
          - <t:decoration>✖ </t><t:click>丢弃键</t>
          - '   <t:regular>重置为默认值.'
          material: INHERIT
          slots: 13
          bedrock:
            detail: true
        taxes:
          name: '<t:regular_heading>缴纳税费: <v:current>'
          lore:
          - <t:decoration>✖ </t><t:regular>此职位的成员
          - '   是否需要缴纳税费?'
          - '   <t:decoration>• </t><t:regular>城镇会从此职位和子区域收取<t:regular_value> <v:taxes>
            <t:regular>税费,'
          - '     周期为<t:time> <v:time></t>.'
          material: GOLD_INGOT
          slots: 15
        apply_always:
          name: <t:regular_heading>自动添加职位到新子区域
          lore:
          - <t:regular>此职位及其成员和权限始终会添加到新
          - 子区域中, 此职位无法关闭此设置.
          material: OAK_FENCE
          slots: 14
        members_visitor:
          name: <t:regular_heading>职位成员
          lore:
          - <t:regular>所有未加入城镇的玩家都会被分配到此职位.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        child_failure_priority:
          name: <t:error_heading>职位优先级不足
          lore:
          - <t:error>你无权编辑此职位的设置.
          - '  <t:decoration>• </t><t:regular>该职位的优先级高于你的职位, 或者你是该职位的成员.'
        members_nation:
          name: <t:regular_heading>职位成员
          lore:
          - <t:regular>所有未加入城镇但属于你所在联邦的玩家
          - 都会被分配到此职位.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        child_failure_access:
          name: <t:error_heading>职位权限不足
          lore:
          - <t:error>你无权编辑此子区域中的职位.
          - '  <t:decoration>• </t><t:regular>城镇所有者可以为你的职位授予'
          - '    执行此操作的权限.'
        management:
          name: <t:regular_heading>管理设置
          lore:
          - <t:decoration>✖ </t><t:regular>切换管理设置,
          - '   例如邀请玩家, 占领领土等.'
          material: GOLD_INGOT
          slots: 30
        members:
          name: <t:regular_heading>职位成员
          lore:
          - <t:decoration>✖ </t><t:regular>查看所有职位成员.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        name:
          name: <t:regular_heading>重命名
          lore:
          - <t:decoration>✖ </t><t:regular>重命名此职位.
          - '   当前名称: <t:user_content><v:name></t>'
          material: NAME_TAG
          slots: 12
        child_failure_nation:
          name: <t:error_heading>职位由联邦管理
          lore:
          - <t:error>此职位部分由你所在的联邦管理.
          - '  <t:decoration>• </t><t:regular>只有联邦首都可以更改此设置: <t:cmd>/<v:cmd></t>'
  list_area_invites:
    title: <t:menu_title>已发送的邀请和请求
    items:
      default:
        entry_object_owner_land:
          name: <t:entry_heading><v:player> <t:decoration>-</t> 所有权请求
          lore:
          - <t:regular>将此玩家设为城镇<t:entity_land> <v:land> </t>的新所有者.
          - ''
          - <t:regular_heading>信息</t>
          - ' <t:decoration>• </t><t:regular>发送时间:<t:time> <v:time></t>'
          - ' <t:decoration>• </t><t:regular>发送者: <v:sender>'
          - ''
          - <t:decoration>✖ </t><t:click>丢弃键</t>
          - '   <t:regular>撤回此邀请.'
        entry_object_merge:
          name: <t:entry_heading><v:merge> <t:decoration>-</t> 合并请求
          lore:
          - <t:regular>将城镇<t:entity_land> <v:merge> </t>合并到此处.
          - ''
          - <t:regular_heading>信息</t>
          - ' <t:decoration>• </t><t:regular>发送时间:<t:time> <v:time></t>'
          - ' <t:decoration>• </t><t:regular>发送者: <v:sender>'
          - ' <t:decoration>• </t><t:regular>接收方: <t:regular_value><v:receiver></t>'
          - ''
          - <t:decoration>✖ </t><t:click>丢弃键</t>
          - '   <t:regular>撤回此邀请.'
          material: INHERIT
        entry_object_trust_area:
          name: <t:entry_heading><v:player> <t:decoration>-</t> <t:regular_heading>成员邀请
          lore:
          - <t:regular>将此玩家加入子区域 <t:regular_value><v:area></t>.
          - ''
          - <t:regular_heading>信息</t>
          - ' <t:decoration>• </t><t:regular>发送时间:<t:time> <v:time></t>'
          - ' <t:decoration>• </t><t:regular>发送者: <v:sender>'
          - ''
          - <t:decoration>✖ </t><t:click>撤回</t>
          - '   <t:regular>撤回此邀请.'
          material: INHERIT
        child_failure_access:
          name: <t:error_heading>职位权限不足
          lore:
          - <t:error>你无权撤回
          - 此子区域中的邀请.
          - ' <t:decoration>• </t><t:regular>城镇所有者可以为你的职位授予'
          - '   移除玩家的权限.'
        entry_object_trust_land:
          name: <t:entry_heading><v:player> <t:decoration>-</t> 成员邀请
          lore:
          - <t:regular>将此玩家加入整个
          - 城镇 <t:entity_land><v:land></t>.
          - ''
          - <t:regular_heading>信息</t>
          - <t:decoration>• </t><t:regular>发送时间:<t:time> <v:time></t>
          - '<t:decoration>✖ </t><t:regular>发送者: <v:sender>'
          - <t:decoration>✖ </t><t:click>撤回</t>
          - '   <t:regular>撤回此邀请.'
          material: INHERIT
        entry_object_owner:
          material: INHERIT
  land_various:
    title: <t:menu_title>杂项
    items:
      default:
        title:
          name: <t:regular_heading>宣言
