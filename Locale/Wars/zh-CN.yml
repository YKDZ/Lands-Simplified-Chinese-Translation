      fight: <t:negative>战斗中</t>

wars:
  message:
    noaccess:
      wilderness: '<t:error>参与战争时, 不能在荒野中这样做. <t:decoration>标志: </t><t:regular_value><v:flag></t>'
      general: '<t:error>在当前对城镇<t:error_value> <v:land> </t>的战争中, 不能这样做. <t:decoration>标志:
        </t><t:regular_value><v:flag></t>'
      pillage: <t:error>守方在线人数不足时, 你不能掠夺城镇<t:error_value> <v:land></t>. <t:regular>请等待至少<t:limit>
        <v:defenders> </t>名守方在城镇<t:entity_land> <v:land> </t>中在线.
      allies: <t:error>在这场战争中, 你只能侵略攻方<t:error_value> <v:attacker> </t>和守方<t:error_value>
        <v:defender></t>. <t:regular>不能侵略任一方的盟友.
    start:
      broadcast: <t:regular><v:attacker> <t:regular>与 <v:defender> <t:regular>之间的战争开始了.
        战争将在<t:time> <v:time> </t>后结束.
    end:
      broadcast:
        won: <t:regular><v:winner> <t:regular>赢得了对 <v:loser> <t:regular>的战争, 比分为<t:regular_value>
          <v:winner_points> </t>比<t:regular_value> <v:loser_points></t>. 战争持续了<t:time>
          <v:time></t>.
        surrendered:
          war: <v:loser> <t:regular>以<t:regular_value> <v:loser_points> </t>分投降. 战争结束,
            他们将<t:cost> <v:tribute> </t>赔偿金支付给政敌 <v:winner><t:decoration>(</t><t:regular_value><v:winner_points>
            </t><t:regular>分<t:decoration>)</t><t:regular>. 战争持续了<t:time> <v:time></t>.
          preparation: <v:loser> <t:regular>在战争准备阶段投降, 并将<t:cost> <v:tribute> </t>赔偿金支付给政敌
            <v:winner><t:regular>.
        draw: <t:regular><v:attacker> <t:regular>与 <v:defender> <t:regular>之间的战争以平局结束,
          得分为<t:regular_value> <v:points></t>. 战争持续了<t:time> <v:time></t>.
    kill:
      target:
        attackers: <t:regular>我们的队友<t:regular_value> <v:attacker> </t>被守方<t:regular_value>
          <v:defender> </t>击杀了.
        defenders: <t:regular>我们的队友<t:regular_value> <v:defender> </t>被攻方<t:regular_value>
          <v:attacker> </t>击杀了.
      killer:
        attackers: '<t:regular>我们的队友<t:regular_value> <v:attacker> </t>击杀了守方<t:regular_value>
          <v:defender></t>: <t:positive><b>+ <v:points> 分'
        defenders: '<t:regular>我们的队友<t:regular_value> <v:defender> </t>击杀了攻方<t:regular_value>
          <v:attacker></t>: <t:positive><b>+ <v:points> 分'
    capture:
      place:
        wilderness: <t:error>不能在荒野放置战旗. <t:regular>你需要将它放置在政敌的城镇内.
        overlap: <t:error>战旗必须放置在信标不会与荒野重叠的位置.
        region: <t:error>无法在这里放置战旗. <t:regular>它会与另一个战旗的占领区域重叠.
        outskirts: <t:error>无法在这里放置战旗. <t:regular>你必须将它放置在城镇的外围.
        state: <t:error>你目前未与城镇<t:error_value> <v:land> </t>交战, 或战争尚未开始.
        y: <t:error>无法在这里放置战旗. <t:regular>放置高度必须在<t:limit> <v:min> </t>到<t:limit>
          <v:max> </t>格之间.
        already: <t:error>无法在这里放置战旗. <t:regular>这个区块已经放置了一面战旗.
        space: <t:error>无法在这里放置战旗. <t:regular>这个位置没有足够的空间.
        cooldown: <t:error>你的队伍还需等待<t:error_value> <v:time> </t>后才能再次放置战旗.
        max: <t:error>你的队伍已同时放置<t:error_value> <v:max> </t>面战旗, 达到数量上限.
        invader: '<title><t:success>战旗<subtitle><t:success>已放置在政敌城镇: <v:land>, <v:x>,
          <v:y>, <v:z><actionbar><t:success>加入他们, 共同占领该子区域.'
        defender: '<title><t:error>战旗<subtitle><t:error>已放置在我方城镇: <v:land>, <v:x>,
          <v:y>, <v:z><actionbar><t:error>前往此处, 加入守方.'
      destroy:
        presence: <t:error>目前无法破坏这面战旗. <t:regular>该子区域仍有<t:regular_value> <v:players>
          </t>名来自政敌阵营的玩家.
        invader: <title><t:error>战旗<subtitle><t:error>政敌城镇 <v:land> 中的战旗已被摧毁
        defender: <title><t:success>战旗<subtitle><t:success>已从我方城镇 <v:land> 中移除<actionbar><t:success><b>+
          <v:points> 点数
        invaders-break: <t:error>入侵者不能破坏自己的战旗.
      progress:
        none:
          area: <bossbar:white:solid><t:regular>占领暂停 - <t:regular_value><v:progress>%</t>
            - 没有任何一方人数占优
          broadcast: '<bossbar:white:solid><t:regular>占领暂停 - <t:regular_value><v:progress>%</t>,
            x: <t:regular_value><v:x></t>, y: <t:regular_value><v:y></t>, z: <t:regular_value><v:z></t>'
        invaders:
          broadcast: '<bossbar:red:solid><t:error>政敌正在占领 - <v:progress>%, <v:invaders>
            名入侵者, x: <v:x>, y: <v:y>, z: <v:z>'
          invaders: <bossbar:red:solid><t:error>我方正在占领 - <v:progress>%, <v:defenders>
            名守方玩家
          defenders: <bossbar:red:solid><t:error>政敌正在占领 - <v:progress>%, <v:invaders>
            名入侵者
        defenders:
          broadcast: '<bossbar:green:solid><t:positive>我方正在夺回 - <v:progress>%, <v:invaders>
            名入侵者, x: <v:x>, y: <v:y>, z: <v:z>'
          invaders: <bossbar:red:solid><t:error>守方正在夺回 - <v:progress>%, <v:defenders>
            名守方玩家
          defenders: <bossbar:green:solid><t:positive>我方正在夺回 - <v:progress>%, <v:invaders>
            名入侵者
      health:
        status: '<bossbar:white:solid><t:regular>战旗生命值: <t:regular_value><v:health>%</t>'
        invaders: <t:positive>你的战旗状态良好! <t:positive><b>+<v:points> <!b><t:regular>点数已计入你的队伍.
        defenders: <t:positive>政敌的战旗已被削弱! <t:positive><b>+<v:points> <!b><t:regular>点数已获得.
        damage: '<t:regular>战旗: <t:error_value>-<v:damage> </t>点生命值 <t:decoration>|
          </t><t:error_value><v:health>%</t> <t:regular>剩余生命值.'
      online: '<actionbar><t:error>无法占领: 至少需要<t:error_value> <v:min> </t>名来自城镇<t:error_value>
        <v:land> </t>的玩家在线.'
      success:
        invader: <title><t:success>占领点<subtitle><t:success>我方占领了 <v:chunks> 个属于 <v:land>
          的区块<actionbar><t:success><b>+ <v:points> 分
        defender: <title><t:error>占领点<subtitle><t:error>政敌占领了 <v:chunks> 个属于 <v:land>
          的区块
