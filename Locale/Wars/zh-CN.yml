      start: <t:regular>对<t:entity_land> <v:0> </t>的战争已经开始. 最大持续时长:<t:time> <v:1></t>
      declaration:
        sent: <t:regular>已向<t:entity_land> <v:0> </t>宣战. 战争将在<t:time> <v:1> </t>后开始.
        received: <t:negative_value><v:0></t> <t:negative>已向我们宣战. <t:regular>战争将在<t:time>
          <v:1> </t>后开始.
        mutual:
          sent: <t:regular>已向<t:entity_land> <v:0> </t>发送战争请求. 对方需要接受.
          received: '<t:negative_value><v:0></t> <t:negative>发送了战争请求. 接受: <t:cmd>/<v:1></t>'
          denied: <t:regular><t:entity_land> <v:0> </t>已拒绝战争请求.
      surrender:
        sent: <t:negative>已在战争中投降. 向敌方支付<t:negative_value> <v:0> </t>作为赔偿金.
        received: <t:regular>敌方<t:entity_land> <v:0> </t>已投降. 收到<t:regular_value>
          <v:1> </t>作为赔偿金.
      end:
        won: <t:regular>我们赢得了对<t:entity_land> <v:0> </t>的战争, 得分为<t:regular_value>
          <v:1></t>. 对方只有<t:regular_value> <v:2> </t>分. 战争持续了<t:time> <v:3></t>.
        draw: <t:regular>对<t:entity_land> <v:0> </t>的战争以平局结束, 得分为<t:regular_value>
          <v:1></t>.
        lost: <t:regular>我们输掉了对<t:entity_land> <v:0> </t>的战争, 得分为<t:regular_value>
          <v:1></t>. 对方有<t:regular_value> <v:2> </t>分. 战争持续了<t:time> <v:3></t>.
  wars:
    object:
      enemy: <t:error_value>政敌</t>
      ally: <t:regular_value>Ally</t>
    nametag:
      enemy: <t:error_value>政敌 </t><t:decoration>| </t>
      ally: <t:regular_value>盟友 </t><t:decoration>| </t>
    state:
