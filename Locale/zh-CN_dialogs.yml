# Here you can edit all dialogs.
#
# If you encounter any issues or have questions:
# Discord: https://discord.incredibleplugins.com
#
# Wiki: https://wiki.incredibleplugins.com/general/locale-and-config/dialogs

dialogs:
  input:
    title: 输入
    inputs:
      text:
        label: 文本
      player:
        label: 玩家
    buttons:
      confirm:
        label: <t:positive>确认
        tooltip: 点此确认输入.
      discard:
        label: <t:negative>放弃
        tooltip: 点此放弃输入.
  add_member:
    title: 添加玩家
    inputs:
      name:
        label: 玩家
    buttons:
      add:
        label: <t:positive>添加
        tooltip: 让此玩家永久加入.
      add-temporary:
        label: <t:regular_value>临时加入
        tooltip: 让此玩家临时加入.
      discard:
        label: <t:negative>放弃
        tooltip: 点击放弃.
  add_member_duration:
    title: 临时成员
    inputs:
      days:
        type: number-range
        label: 天
        label-format: '<v:label>: <v:value>'
        start: 0
        end: 30
        step: 1
        initial: 0
      hours:
        type: number-range
        label: 小时
        label-format: '<v:label>: <v:value>'
        start: 0
        end: 23
        step: 1
        initial: 0
    bodies:
      info:
        text: 玩家仅在选定时长内作为成员. 临时成员无需缴纳税费, 且无法占领或取消占领, 除非该玩家同时也是其他子区域的永久成员.
    buttons:
      add:
        label: <t:positive>添加
        tooltip: 让此玩家加入, 有效期为选定时长.
      back:
        label: <t:regular>返回
        tooltip: 返回.
  land_create:
    title: 创建城镇
    inputs:
      name:
        label: 名称
      tag:
        label: 标签
    bodies:
      info:
        text: 创建此城镇需要花费<t:cost> <v:cost></t>. 如果空间足够, 将为你的新城镇占领<t:regular_value> <v:chunks></t> 个区块.
      tag:
        text: 标签是你城镇名称的简写.
        item:
          material: NAME_TAG
          hide-tooltip: true
    buttons:
      confirm:
        label: <t:positive>创建
        tooltip: 点击创建新城镇.
      discard:
        label: <t:negative>放弃
        tooltip: 点击放弃创建城镇.
  confirm:
    buttons:
      discard:
        tooltip: 点此取消.
        label: <t:negative>取消
      confirm:
        label: <t:positive>确认
        tooltip: 点此确认.
    bodies:
      info:
        text: <v:message>
    title: 确认
value:
  confirm:
    admin:
      database:
        restore:
          confirm: <t:negative>确认清除当前所有 Lands 数据, 并用所选备份替换吗?</t> <t:regular>备份创建后保存的所有数据都将丢失. 恢复完成后服务器会立即重启. 如果未配置重启脚本, 请手动重新启动服务器.
      land:
        addrole:
          confirm: <t:negative>确认添加此职位吗?</t> <t:regular>已拥有此职位的城镇会重复获得该职位, 例如通过 roles.yml 获得此职位的新城镇. 对同一职位再次执行此操作会继续添加重复职位.
      limits:
        migrate:
          confirm: '<t:negative>确认将旧限制权限迁移到限制包吗?</t> <t:regular>请先在 <v:file> 中配置所有限制包: 系统将据此计算编号权限与对应限制包之间的差值. 请先备份数据库, 以便在需要时撤销此操作.'
    claim:
      merge:
        confirm: <t:regular>确认将城镇<t:entity_land> <v:merge></t> 合并到<t:entity_land> <v:land></t>, 并支付<t:cost> <v:cost></t> 吗?
    delete:
      confirm: <t:regular>确认解散城镇<t:entity_land> <v:land></t> 吗? 此操作无法撤销.
    general:
      input:
        confirm: <t:regular>确认执行命令<t:cmd>/<v:input></t> 吗?
    leave:
      confirm: <t:regular>确认离开城镇<t:entity_land> <v:land></t> 吗? 你占领的<t:regular_value> <v:chunks></t> 个领土区块可能被取消占领.
    member:
      setowner:
        confirm: <t:regular>确认将玩家<t:regular_value> <v:player></t> 设为城镇<t:entity_land> <v:land></t> 的新主人吗?
    nation:
      leave:
        confirm: <t:regular>确认让城镇<t:entity_land> <v:land></t> 退出联邦<t:entity_nation> <v:nation></t> 吗?
    nations:
      delete:
        confirm: <t:regular>确认解散联邦<t:entity_nation> <v:nation></t> 吗? 此操作无法撤销.
      member:
        setcapital:
          confirm: <t:regular>确认将城镇<t:entity_land> <v:land></t> 设为联邦<t:entity_nation> <v:nation></t> 的新首都吗?
      war:
        declare:
          confirm: <t:regular>确认向 <v:defender><t:regular> 宣战, 并以 <v:attacker><t:regular> 的身份参战吗?
          shield:
            confirm: <t:regular>确认向 <v:defender><t:regular> 宣战吗? 这将移除你的战争护盾 <t:decoration>(</t><t:time><v:shield></t> 后到期<t:decoration>)</t>, 此后你可能遭受攻击.
    rental:
      buy:
        confirm: <t:regular>确认购买城镇<t:entity_land> <v:land></t>, 并支付<t:cost> <v:price></t> 吗? 购买后, 该城镇的成员将被移出城镇.
        confirm-area: <t:regular>确认购买城镇<t:entity_land> <v:land></t> 中的子区域<t:regular_value> <v:area></t>, 并支付<t:cost> <v:price></t> 吗?
        confirm-land: <t:regular>确认购买城镇<t:entity_land> <v:land></t>, 并支付<t:cost> <v:price></t> 吗?
      remove:
        tenant:
          confirm: <t:regular>确认支付<t:cost> <v:cost></t> 补偿金, 与住户<t:regular_value> <v:player></t> 解约吗?
    unclaim:
      all:
        confirm: <t:regular>确认取消占领城镇<t:entity_land> <v:land></t> 的所有领土区块吗?
    war:
      declare:
        confirm: <t:regular>确认向 <v:defender><t:regular> 宣战, 并以 <v:attacker><t:regular> 的身份参战吗?
        shield:
          confirm: <t:regular>确认向 <v:defender><t:regular> 宣战吗? 这将移除你的战争护盾 <t:decoration>(</t><t:time><v:shield></t> 后到期<t:decoration>)</t>, 此后你可能遭受攻击.
      independence:
        confirm: <t:regular>确认脱离联邦<t:entity_nation> <v:nation></t> 并宣布独立吗? 城镇<t:entity_land> <v:land></t> 将退出该联邦, 并与其进入战争状态.
