# In this file you can configure categories. Land categories can be set
# in the various options menu of a land. This helps players finding
# for example shop lands in the /lands list menu.
#
# You can add your own categories and delete existing ones.
# NOTE: A server reload or restart is required for any changes of this file to take effect.

land:
  enabled: true
  categories:
    members:
      enabled: true
      # Allow land owners to enable a option to automatically accept new membership requests.
      # If set to false, the option is also disabled for existing lands, when the server is restarted.
      allow-auto-accept: true
      name: '&e成员募集中 ☺'
      description:
        - '&7这个城镇正在募集新成员.'
    shop:
      enabled: true
      name: '&c商店 $'
      description:
        - '&7这个城镇中有商店.'
    pvp:
      enabled: true
      name: '&4PvP 场地 ⚔'
      description:
        - '&7这个城镇中有 PVP 场地.'
    mobfarm:
      enabled: true
      name: '&9刷怪塔'
      description:
        - '&7这个城镇中有刷怪塔.'
